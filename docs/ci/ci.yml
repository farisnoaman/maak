# Copy this file to `.github/workflows/ci.yml` to activate CI.
#
# It lives in docs/ci/ because the GitHub App used by the coding agent lacks the `workflows`
# permission, so it cannot push files under `.github/workflows/`. Activate it on a machine (or with a
# token) that has the permission:
#   npm run ci:install && git add .github/workflows/ci.yml && git commit -m "ci: activate" && git push

name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Guards, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Architecture promises first: a broken boundary is a design bug, not a style nit.
      - name: Guards (boundaries, RTL, secrets, migrations)
        run: npm run check:guards

      - name: Lint (ESLint + custom architecture rules)
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Unit tests with coverage thresholds
        run: npm run test:coverage

      - name: Database types match migrations
        run: npm run db:types:check

      - name: Edge bundle builds and is consistent
        run: |
          npm run build:functions
          npm run check:functions

      - name: Web production build
        run: npm --workspace @maak/web run build

  database:
    name: Postgres rules (migrations + pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No Docker and no Supabase CLI needed: an embedded PostgreSQL applies every migration, runs the
      # committed pgTAP suites and diffs the live schema against database.types.ts.
      - name: Migrations, pgTAP suites, type drift
        run: npm run sql:check

  supabase:
    name: Supabase stack (real CLI, RLS + storage)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase start

      - name: Apply migrations and seed
        run: supabase db reset

      - name: Lint SQL
        run: supabase db lint --level error

      # The genuine pgTAP extension, against the real platform (auth.users, storage, PostGIS).
      - name: pgTAP — write lockdown, RLS, append-only audit
        run: supabase test db

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dependency audit (high and above)
        run: npm audit --audit-level=high

      - name: Service-role key must not reach a client bundle
        run: |
          npm --workspace @maak/web run build
          if grep -rIl "SUPABASE_SERVICE_ROLE_KEY" apps/web/.next/static 2>/dev/null; then
            echo "::error::service role key referenced in client bundle"
            exit 1
          fi
          echo "clean"

  accessibility:
    name: Accessibility + direction smoke (ar/en)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start web server
        run: |
          npm --workspace @maak/web run dev &
          npx wait-on http://127.0.0.1:3000/ar --timeout 90000

      - name: Checks (lang/dir, landmarks, labels, skip link) in RTL and LTR
        run: npm run check:a11y
