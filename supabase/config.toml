project_id = "maak"

[api]
enabled = true
port = 54321
schemas = ["public", "app", "audit"]
extra_search_path = ["public", "app", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"
# Edge functions verify their own JWTs (see functions/_shared/auth.ts), so the platform
# gate is disabled here to keep one authorization implementation instead of two.
verify_jwt = false

[analytics]
enabled = false
